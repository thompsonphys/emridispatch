name: Install package
description: Set up Python and install the package with all extras

inputs:
  python-version:
    description: Python version to set up
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: ${{ inputs.python-version }}
        miniforge-version: latest
        activate-environment: emridispatch
        auto-activate-base: false

    - name: Install conda dependencies
      shell: bash -el {0}
      run: |
        conda install -y -c conda-forge --override-channels cxx-compiler pkgconfig "libblas=*=*netlib" "libcblas=*=*netlib" "liblapack=*=*netlib" "liblapacke=*=*netlib"

    - name: Install package
      shell: bash -el {0}
      run: |
        conda run -n emridispatch python -m pip install --upgrade pip setuptools wheel
        conda run -n emridispatch python -m pip install -e ".[all]"
